const DATA = {"version": 1, "categories": [{"id": "01", "title": "Survival Essentials", "blurb": "The handful of words that get you through almost anything in Japan.", "sections": [{"title": "The magic words", "entries": [{"jp": "すみません", "kana": "すみません", "romaji": "sumimasen", "say": "soo-mee-mah-sen", "audio": "cce1862bcbd9", "en": "Excuse me / Sorry / Thank you (for the trouble)", "note": "The most useful word in Japan. Use it to get a waiter's attention, squeeze past someone, apologize for small things, or thank someone who went out of their way for you. Said fast it often sounds like \"suimasen\".", "examples": [{"jp": "すみません、注文いいですか", "kana": "すみません、ちゅうもんいいですか", "romaji": "sumimasen, chuumon ii desu ka", "say": "soo-mee-mah-sen, choo-mohn ee dess kah", "audio": "dcee8cd89c1b", "en": "Excuse me, can I order?"}, {"jp": "あ、すみません", "kana": "あ、すみません", "romaji": "a, sumimasen", "say": "ah, soo-mee-mah-sen", "audio": "69c3bee36126", "en": "Oh, sorry (bumped into you)."}], "reply": null, "tags": ["say", "polite"], "find": "excuse me, sorry, call waiter, get attention, apologize, thanks, pardon", "also": []}, {"jp": "ありがとうございます", "kana": "ありがとうございます", "romaji": "arigatou gozaimasu", "say": "ah-ree-gah-toh goh-zai-mahss", "audio": "24afcca10e22", "en": "Thank you / Thanks (polite)", "note": "The standard polite thank-you for staff, strangers and anyone older. Plain \"arigatou\" is for friends. In shops staff slur it to \"zaimas\" or \"zaass\".", "examples": [], "reply": null, "tags": ["say", "polite"], "find": "thanks, thank you, grateful, appreciate", "also": [{"jp": "ありがとう", "kana": "ありがとう", "romaji": "arigatou", "say": "ah-ree-gah-toh", "audio": "42d0969029e9", "en": "Thanks (casual, friends)"}, {"jp": "どうも", "kana": "どうも", "romaji": "doumo", "say": "doh-moh", "audio": "a481ff73f54d", "en": "Thanks (quick, very common with staff)"}, {"jp": "どうもありがとうございます", "kana": "どうもありがとうございます", "romaji": "doumo arigatou gozaimasu", "say": "doh-moh ah-ree-gah-toh goh-zai-mahss", "au bf20af317908", "en": "I'm fine / No thanks / It's OK", "note": "The ultimate multi-tool. With a little wave of the hand it politely declines bags, receipts, chopsticks, help or flyers. As a question (daijoubu desu ka?) it means \"Are you OK? / Is it OK?\".", "examples": [{"jp": "袋は大丈夫です", "kana": "ふくろはだいじょうぶです", "romaji": "fukuro wa daijoubu desu", "say": "foo-koo-roh wah dai-joh-boo dess", "audio": "8b37bb06707a", "en": "I don't need a bag."}, {"jp": "大丈夫ですか", "kana": "だいじょうぶですか", "romaji": "daijoubu desu ka", "say": "dai-joh-boo dess kah", "audio": "91472e209b87", "en": "Are you OK? / Is that OK?"}], "reply": null, "tags": ["say", "both", "polite"], "find": "no thanks, decline, I'm okay, it's fine, are you ok, refuse politely, no need", "also": []}, {"jp": "結構です", "kana": "けっこうです", "romaji": "kekkou desu", "say": "kek-koh dess", "audio": "3e1fde855532", "en": "No thank you (firm)", "note": "Firmer, more final than daijoubu desu. Good for pushy salespeople, street touts or when someone keeps offering. Can sound cold with friends.", "examples": [], "reply": null, "tags": ["say", "polite"], "find": "no thank you firmly, refuse, reject tout, go away politely", "also": []}, {"jp": "はい", "kana": "はい", "romaji": "hai", "say": "hai", "audio": "c92b4cda8bdf", "en": "Yes / OK / Here you go", "note": "Also used as \"I'm listening\" and when handing something over. Saying \"hai\" doesn't always mean agreement, just \"I heard you\".", "examples": [], "reply": null, "tags": ["both", "polite"], "find": "yes, okay, sure, here you are", "also": []}, {"jp": "いいえ", "kana": "いいえ", "romaji": "iie", "say": "ee-eh", "audio": "f901585367d6", "en": "Not at all / No (textbook)", "note": "A bit stiff for daily life. Many people say \"iie\" mostly to brush off thanks (\"iie, iie\" = no no, it's nothing). To decline something, daijoubu desu or a head shake is more natural.", "examples": [{"jp": "いいえ、とんでもないです", "kana": "いいえ、とんでもないです", "romaji": "iie, tondemonai desu", "say": "ee-eh, tohn-deh-m  "What is this?"}], "reply": null, "tags": ["say", "both"], "find": "this, this one, point at something", "also": []}, {"jp": "それ", "kana": "それ", "romaji": "sore", "say": "soh-reh", "audio": "41fa8f054626", "en": "That (near you)", "note": "For things near the person you're talking to.", "examples": [{"jp": "それはいくらですか", "kana": "それはいくらですか", "romaji": "sore wa ikura desu ka", "say": "soh-reh wah ee-koo-rah dess kah", "audio": "809815cf2e23", "en": "How much is that?"}], "reply": null, "tags": ["say", "both"], "find": "that, that one near you", "also": []}, {"jp": "あれ", "kana": "あれ", "romaji": "are", "say": "ah-reh", "audio": "01dd1d4130bb", "en": "That over there", "note": "For things far from both of you. \"Are?\" (rising) also means \"Huh? / Wait, what?\" when you notice something odd.", "examples": [], "reply": null, "tags": ["say", "both"], "find": "that over there, far away thing, huh", "also": []}, {"jp": "どれ", "kana": "どれ", "romaji": "dore", "say": "doh-reh", "audio": "793b833d8a25", "en": "Which one?", "note": "", "examples": [{"jp": "どれがおすすめですか", "kana": "どれがおすすめですか", "romaji": "dore ga osusume desu ka", "say": "doh-reh gah oh-soo-soo-meh dess kah", "audio": "a6223ab86ddc", "en": "Which one do you recommend?"}], "reply": null, "tags": ["both"], "find": "which one, which", "also": []}, {"jp": "この/その/あの", "kana": "この/その/あの", "romaji": "kono / sono / ano", "say": "koh-noh / soh-noh / ah-noh", "audio": "d08bfe9608be", "en": "This ___ / That ___ / That ___ over there", "note": "Same as kore/sore/are but must be followed by a noun: \"kono hon\" (this book), \"ano hito\" (that person over there).", "examples": [{"jp": "この電車は新宿に行きますか", "kana": "このでんしゃはしんじゅくにいきますか", "romaji": "kono densha wa shinjuku ni ikimasu ka", "say": "koh-noh den-shah wah sheen-joo-koo nee ee-kee-mahss kah", "audio": "12ef4ac02a12", "en": "Does this train go to Shinjuku?"}], "reply": null, "tags": ["say", "both"], "find": "this thing, that thing, this train, that person", "also": []}, {"jp": "ここ/そこ/あそこ", "kana": "ここ/そこ/あそこ", "romaji": "koko / soko / asoko", "say": "koh-koh / soh-koh / ah-soh-koh", "audio": "68afe2571420", "en": "Here / There / Over there", "note": "", "examples": [{"jp": "ここでいいですか", "kana": "ここでいいですか", "romaji": "koko de ii desu ka", "say": "koh-koh deh ee dess kah", "audio": "87023d6a2c73", "en": "Is here OK? (to sit, stop, put something)"}], "reply": null, "tags": ["say", "both"], "find": "here, there, over there, location", "also": []}, {"jp": "こちら", "kana": "こちら", "romaji": "kochira", "say": "koh-chee-rah", "audio": "8e357a093d6d", "en": "This way / Here / This (polite)", "note": "Polite version of \"koko\" and \"kore\". Staff use it constantly: \"kochira e douzo\" (this way please), \"kochira desu\" (here it is).", "examples": [], "reply": null, "tags": ["hear", "polite"], "find": "this way, here polite, this one polite", "also": []}]}, {"title": "Asking for things", "entries": [{"jp": "〜はありますか", "kana": "〜はありますか", "romaji": "~ wa arimasu ka", "say": "wah ah-ree-mahss kah", "audio": "9b7c225a8cc1", "en": "Do you have ___? / Is there ___?", "note": "Put any noun in front. Works for items in a shop, a bathroom, Wi-Fi, an English menu, a smaller size.", "examples": [{"jp": "英語のメニューはありますか", "kana": "えいごのメニューはありますか", "romaji": "eigo no menyuu wa arimasu ka", "say": "ay-goh noh meh-nyoo wah ah-ree-mahss kah", "audio": "653e84e50ee5", "en": "Do you have an English menu?"}, {"jp": "Wi-Fiはありますか", "kana": "ワイファイはありますか", "romaji": "waifai wa arimasu ka", "say": "wai-fai wah ah-ree-mahss kah", "audio": "e8f4ce20ab80", "en": "Is there Wi-Fi?"}], "reply": null, "tags": ["say", "polite"], "find": "do you have, is there, available, in stock", "also": []}, {"jp": "〜はどこですか", "kana": "〜はどこですか", "romaji": "~ wa doko desu ka", "say": "wah doh-koh dess kah", "audio": "f01c639c9c2e", "en": "Where is ___?", "note": "", "examples": [{"jp": "トイレはどこですか", "kana": "トイレはどこですか", "romaji": "toire wa doko desu ka", "say": "toy-reh wah doh-koh dess kah", "audio": "b702f8a39967", "en": "Where is the bathroom?"}, {"jp": "駅はどこですか", "kana": "えきはどこですか", "romaji": "eki wa doko desu ka", "say": "eh-kee wah doh-koh dess kah", "audio": "5374a03b2f1d", "en": "Where is the station?"}], "reply": null, "tags": ["say", "polite"], "find": "where is, location, find, looking for", "also": []}, {"jp": "いくらですか", "kana": "いくらですか", "romaji": "ikura desu ka", "say": "ee-koo-rah dess kah", "audio": "9cf278a8c8d6", "en": "How much is it?", "note": "", "examples": [{"jp": "これはいくらですか", "kana": "これはいくらですか", "romaji": "kore wa ikura desu ka", "say": "koh-reh wah ee-koo-rah dess kah", "audio": "7485de2cc032", "en": "How much is this?"}], "reply": null, "tags": ["say", "polite"], "find": "how much, price, cost", "also": []}, {"jp": "〜を探しています", "kana": "〜をさがしています", "romaji": "~ o sagashite imasu", "say": "oh sah-gah-shee-teh ee-mahss", "audio": "f91ad6fbda7f", "en": "I'm looking for ___", "note": "", "examples": [{"jp": "駅を探しています", "kana": "えきをさがしています", "romaji": "eki o sagashite imasu", "say": "eh-kee oh sah-gah-shee-teh ee-mahss", "audio": "2d13803b8fc3", "en": "I'm looking for the station."}], "reply": null, "tags": ["say", "polite"], "find": "looking for, searching, can't find", "also": []}, {"jp": "〜てもいいですか", "kana": "〜てもいいですか", "romaji": "~ te mo ii desu ka", "say": "teh moh ee dess kah", "audio": "2ef890785b85", "en": "Is it OK if I ___? / May I ___?", "note": "Attach to the te-form of any verb. Super useful for asking permission.", "examples": [{"jp": "写真を撮ってもいいですか", "kana": "しゃしんをとってもいいですか", "romaji": "shashin o totte mo ii desu ka", "say": "shah-sheen oh toht-teh moh ee dess kah", "audio": "fbea9c57baa3", "en": "May I take a photo?"}, {"jp": "ここに座ってもいいですか", "kana": "ここにすわってもいいですか", "romaji": "koko ni suwatte mo ii desu ka", "say": "koh-koh nee soo-waht-teh moh ee dess kah", "audio": "5f367efef18c", "en": "May I sit here?"}, {"jp": "入ってもいいですか", "kana": "はいってもいいですか", "romaji": "haitte mo ii desu ka", "say": "hait-teh moh ee dess kah", "audio": "958f3d5cc7ca", "en": "May I come in?"}], "reply": null, "tags": ["say", "polite"], "find": "may I, can I, is it okay if, permission, allowed", "also": []}, {"jp": "いいですか", "kana": "いいですか", "romaji": "ii desu ka", "say": "ee dess kah", "audio": "2e2c6573ef2d", "en": "Is it OK?", "note": "Point at a seat, a spot, a product: \"ii desu ka?\" covers \"Can I sit here / take this / use this?\" Answer you'll hear: \"Douzo\" (go ahead).", "examples": [], "reply": {"jp": "どうぞ", "kana": "どうぞ", "romaji": "douzo", "say": "doh-zoh", "audio": "0c5589abf72d", "en": "Go ahead / Please do"}, "tags": ["say", "polite"], "find": "is it okay, can I, alright", "also": []}, {"jp": "どうぞ", "kana": "どうぞ", "romaji": "douzo", "say": "doh-zoh", "audio": "0c5589abf72d", "en": "Go ahead / Here you go / Please (offering)", "note": "This \"please\" is for offering: letting someone go first or handing something over. To ASK for something, use \"onegaishimasu\" or \"kudasai\". If someone says \"douzo\" to you, say \"doumo\" or \"sumimasen\" and go.", "examples": [], "reply": null, "tags": ["both", "polite"], "find": "go ahead, after you, here you are, help yourself", "also": []}, {"jp": "手伝ってもらえますか", "kana": "てつだってもらえますか", "romaji": "tetsudatte moraemasu ka", "say": "teh-tsoo-daht-teh moh-rah-eh-mahss kah", "audio": "9ee2e24a0ba3", "en": "Could you help me?", "note": "Polite request for help. \"Tasukete!\" is only for emergencies.", "examples": [], "reply": null, "tags": ["say", "polite"], "find": "help me please, need help, assist, can you help", "also": []}]}, {"title": "Can, can't, have, don't have", "entries": [{"jp": "あります/ありません", "kana": "あります/ありません", "romaji": "arimasu / arimasen", "say": "ah-ree-mahss / ah-ree-mah-sen", "audio": "9b8f6e444bb4", "en": "There is / There isn't (things)", "note": "For objects and things. \"Arimasu ka?\" = Do you have it? Casual: \"aru?\" / \"nai\".", "examples": [], "reply": null, "tags": ["both", "polite"], "find": "there is, have, exist, there isn't, don't have", "also": []}, {"jp": "ないです", "kana": "ないです", "romaji": "nai desu", "say": "nai dess", "audio": "34c1d10558cf", "en": "There isn't any / I don't have it", "note": "Natural casual-polite way to say you don't have something (points card, reservation, change). Same meaning as \"arimasen\".", "examples": [{"jp": "ポイントカードはないです", "kana": "ポイントカードはないです", "romaji": "pointokaado wa nai desu", "say": "poyn-toh-kah-doh wah nai dess", "audio": "2f508b9c9158", "en": "I don't have a points card."}], "reply": null, "tags": ["say", "polite"], "find": "don't have, none, there isn't any, no card", "also": []}, {"jp": "いいです", "kana": "いいです", "romaji": "ii desu", "say": "ee dess", "audio": "06a38a925d1a", "en": "It's fine / That's good / No thanks", "note": "Confusing! \"Ii desu\" can mean \"yes, good\" OR \"no thanks, I'm good\" depending on tone and hand gestures. A wave of the hand = no thanks. To be clear, use \"daijoubu desu\" (no thanks) or \"onegaishimasu\" (yes please).", "examples": [], "reply": null, "tags": ["both", "careful"], "find": "good, fine, no thanks, okay ambiguous", "also": []}, {"jp": "だめ", "kana": "だめ", "romaji": "dame", "say": "dah-meh", "audio": "975d79a842df", "en": "Not allowed / No good / Don't", "note": "Strong \"no\". You'll see a crossed-arms X gesture (batsu) with it. \"Dame desu ka?\" = Is it not allowed?", "examples": [{"jp": "ここでタバコはだめです", "kana": "ここでタバコはだめです", "romaji": "koko de tabako wa dame desu", "say": "koh-koh deh tah-bah-koh wah dah-meh dess", "audio": "ff348d017dc4", "en": "No smoking here."}], "reply": null, "tags": ["hear", "both"], "find": "not allowed, forbidden, can't, no good, X gesture", "also": []}, {"jp": "できます/できません", "kana": "できます/できません", "romaji": "dekimasu / dekimasen", "say": "deh-kee-mahss / deh-kee-mah-sen", "audio": "e991d16979fa", "en": "Can do / Can't do", "note": "", "examples": [{"jp": "カードはできますか", "kana": "カードはできますか", "romaji": "kaado wa dekimasu ka", "say": "kah-doh wah deh-kee-mahss kah", "audio": "2b84645498cb", "en": "Ca ct) the thing you act on", "note": "Written を, said \"o\". Goes right after the thing you want, eat, buy, etc. In casual speech it's often dropped: \"kore kudasai\".", "examples": [{"jp": "これをください", "kana": "これをください", "romaji": "kore o kudasai", "say": "koh-reh oh koo-dah-sai", "audio": "39eb03e8b77c", "en": "This, please."}, {"jp": "切符を買いたいです", "kana": "きっぷをかいたいです", "romaji": "kippu o kaitai desu", "say": "keep-poo oh kai-tai dess", "audio": "718219ba48ca", "en": "I want to buy a ticket."}], "reply": null, "tags": ["both"], "find": "object marker, wo, o particle", "also": []}, {"jp": "が", "kana": "が", "romaji": "ga", "say": "gah", "audio": "a142816563b3", "en": "(subject) the one that does / is", "note": "Points at who/what. Often appears with likes, wants, pain and ability: \"___ ga suki\", \"___ ga hoshii\", \"___ ga itai\", \"___ ga dekiru\".", "examples": [{"jp": "ここが痛いです", "kana": "ここがいたいです", "romaji": "koko ga itai desu", "say": "koh-koh gah ee-tai dess", "audio": "33fc17349324", "en": "It hurts here."}, {"jp": "寿司が好きです", "kana": "すしがすきです", "romaji": "sushi ga suki desu", "say": "soo-shee gah soo-kee dess", "audio": "00e3e0b3b13c", "en": "I like sushi."}], "reply": null, "tags": ["both"], "find": "subject marker, ga particle", "also": []}, {"jp": "か", "kana": "か", "romaji": "ka", "say": "kah", "audio": "288c9e077190", "en": "(spoken question mark)", "note": "Put at the end to make any polite sentence a question. In casual speech people just raise their voice instead.", "examples": [{"jp": "大丈夫ですか", "kana": "だいじょうぶですか", "romaji": "daijoubu desu ka", "say": "dai-joh-boo dess kah", "audio": "91472e209b87", "en": "Is it OK?"}], "reply": null, "tags": ["both"], "find": "question marker, ka, make a question", "also": []}, {"jp": "に", "kana": "に", "romaji": "ni", "say": "nee", "audio": "de3d1ecc94b2", "en": "to / at / in (a place or time)", "note": "Destination, location of things/people, and specific times.", "examples": [{"jp": "渋谷に行きたいです", "kana": "しぶやにいきたいです", " sh-shai", "audio": "e8f364a60cef", "en": "Welcome! (casual)", "note": "Shorter version at casual places like ramen shops, izakayas and market stalls.", "examples": [], "reply": null, "tags": ["hear", "casual"], "find": "welcome casual, small shop greeting", "also": []}, {"jp": "何名様ですか", "kana": "なんめいさまですか", "romaji": "nanmei sama desu ka", "say": "nahn-may sah-mah dess kah", "audio": "831d69965ed9", "en": "How many people in your party?", "note": "Hold up fingers and say the number of people: \"hitori\" (1), \"futari\" (2), \"san-nin\" (3), \"yo-nin\" (4).", "examples": [], "reply": {"jp": "二人です", "kana": "ふたりです", "romaji": "futari desu", "say": "foo-tah-ree dess", "audio": "7ae4c6298918", "en": "Two people"}, "tags": ["hear", "formal"], "find": "how many people, party size, table for", "also": [{"jp": "何名様でしょうか", "kana": "なんめいさまでしょうか", "romaji": "nanmei sama deshou ka", "say": "nahn-may sah-mah deh-shoh kah", "audio": "5df3e225ec75", "en": "How many in your party? (even more polite)"}]}, {"jp": "ご予約はされていますか", "kana": "ごよやくはされていますか", "romaji": "goyoyaku wa sarete imasu ka", "say": "goh-yoh-yah-koo wah sah-reh-teh ee-mahss kah", "audio": "bb930065d4aa", "en": "Do you have a reservation?", "note": "", "examples": [], "reply": {"jp": "いいえ、してないです", "kana": "いいえ、してないです", "romaji": "iie, shite nai desu", "say": "ee-eh, shee-teh nai dess", "audio": "4f58c6ef5e7e", "en": "No, I don't"}, "tags": ["hear", "formal"], "find": "reservation, booking, do you have a reservation", "also": [{"jp": "ご予約のお客様ですか", "kana": "ごよやくのおきゃくさまですか", "romaji": "goyoyaku no okyaku sama desu ka", "say": "goh-yoh-yah-koo noh oh-kyah-koo sah-mah dess kah", "audio": "f7c7fd7086de", "en": "Are you a customer with a reservation?"}]}, {"jp": "お好きなお席へどうぞ", "kana": "おすきなおせきへどうぞ", "romaji": "osukina oseki e douzo", "say": "oh-soo-kee-nah oh-seh-kee eh doh-zoh", "audio": "d1eaa990a655", "en": "Please sit wherever you like", "note": "", "examples": [], "reply": null, "tags": ["hear", "formal"], "find": "sit an "note": "When buying alcohol or cigarettes you must tap \"Hai\" (I'm 20 or older) on the customer screen yourself.", "examples": [], "reply": null, "tags": ["hear", "formal"], "find": "age check, alcohol, cigarettes, touch screen, confirm age", "also": [{"jp": "画面のタッチをお願いします", "kana": "がめんのタッチをおねがいします", "romaji": "gamen no tatchi o onegai shimasu", "say": "gah-men noh taht-chee oh oh-neh-gai shee-mahss", "audio": "9ffcf5e1394c", "en": "Please touch the screen"}]}, {"jp": "シールでよろしいですか", "kana": "シールでよろしいですか", "romaji": "shiiru de yoroshii desu ka", "say": "shee-roo deh yoh-roh-shee dess kah", "audio": "67111b920862", "en": "Is a sticker OK (instead of a bag)?", "note": "If you decline a bag, they put a small store sticker on the item to show it's paid for. Say \"hai\".", "examples": [], "reply": null, "tags": ["hear", "formal"], "find": "sticker instead of bag, paid sticker", "also": []}, {"jp": "お支払いは画面で選んでください", "kana": "おしはらいはがめんでえらんでください", "romaji": "oshiharai wa gamen de erande kudasai", "say": "oh-shee-hah-rai wah gah-men deh eh-rahn-deh koo-dah-sai", "audio": "764005a23845", "en": "Please choose your payment method on the screen", "note": "Many konbini now have a customer screen. Look for カード (card), 現金 (cash), 電子マネー (e-money / IC), QR / バーコード決済 (QR pay).", "examples": [], "reply": null, "tags": ["hear", "formal"], "find": "payment screen, choose payment, self-checkout", "also": []}, {"jp": "お金は機械に入れてください", "kana": "おかねはきかいにいれてください", "romaji": "okane wa kikai ni irete kudasai", "say": "oh-kah-neh wah kee-kai nee ee-reh-teh koo-dah-sai", "audio": "5b308fc99b7d", "en": "Please put the money in the machine", "note": "Many stores have cash machines next to the register. Put bills in the slot and coins in the tray; change comes out automatically.", "examples": [], "reply": null, "tags": ["hear", "formal"], "find": "cash machine, insert money, self pay", "also": []}, {"jp": "電子レンジ", "kana": "でんしレンジ", "romaji": "denshirenji", "say": "den-shee-ren-jee", "audio": "573e ed chicken, hot snack, karaage", "also": []}, {"jp": "肉まん", "kana": "にくまん", "romaji": "nikuman", "say": "nee-koo-mahn", "audio": "32981e2802fe", "en": "Steamed meat bun", "note": "Sold in a warmer next to the register, mostly in colder months. \"Pizza-man\", \"an-man\" (red bean) too.", "examples": [], "reply": null, "tags": ["both"], "find": "steamed bun, nikuman, pork bun", "also": []}, {"jp": "おでん", "kana": "おでん", "romaji": "oden", "say": "oh-den", "audio": "dc502de97b4d", "en": "Oden (simmered stew items)", "note": "Winter konbini staple in a pot by the register. You pick items like daikon, egg (tamago), konnyaku.", "examples": [], "reply": null, "tags": ["both"], "find": "oden, hot pot stew", "also": []}, {"jp": "飲み物", "kana": "のみもの", "romaji": "nomimono", "say": "noh-mee-moh-noh", "audio": "ff998bd5e84b", "en": "Drinks", "note": "", "examples": [], "reply": null, "tags": ["both"], "find": "drinks, beverages", "also": []}, {"jp": "水", "kana": "みず", "romaji": "mizu", "say": "mee-zoo", "audio": "1a3d0aa360f2", "en": "Water", "note": "Bottled water. \"Tansansui\" = sparkling water.", "examples": [], "reply": null, "tags": ["both"], "find": "water bottle, sparkling water", "also": [{"jp": "炭酸水", "kana": "たんさんすい", "romaji": "tansansui", "say": "tahn-sahn-soo-ee", "audio": "ffe6e6398ce4", "en": "Sparkling water"}]}, {"jp": "お茶", "kana": "おちゃ", "romaji": "ocha", "say": "oh-chah", "audio": "23d07bd2dd9e", "en": "(green) tea", "note": "Bottled green tea is unsweetened. \"Mugicha\" = barley tea, \"koucha\" = black tea.", "examples": [], "reply": null, "tags": ["both"], "find": "green tea, tea, bottled tea", "also": [{"jp": "麦茶", "kana": "むぎちゃ", "romaji": "mugicha", "say": "moo-gee-chah", "audio": "d5299abdc9c5", "en": "Barley tea"}, {"jp": "紅茶", "kana": "こうちゃ", "romaji": "koucha", "say": "koh-chah", "audio": "e1b97f478a62", "en": "Black tea"}]}, {"jp": "電池", "kana": "でんち", "romaji": "denchi", "say": "den-chee", "audio": "6e07ee23ebaf", "en": "Battery", "note": "For a phone power bank, say \"mobairu batterii\".", "examples": [], "reply": null, "tags": ["both"], "find": "battery", "also": []}, {"jp": "傘", "kana": "かさ", "romaji": "kasa", "say": "kah-sah", "audio": "4eb7b7e8dd3a", "en": "Umbrella", "note": "Konbini sell cheap clear umbrellas (\"biniiru-gasa\") the moment it starts raining.", "examples": [], "reply": null, "tags": ["both"], "find": "umbrella, rain", "also": []}]}]}, {"id": "06", "title": "Restaurants", "blurb": "Getting a table, ordering, special requests, and paying.", "sections": [{"title": "Getting a table", "entries": [{"jp": "二人です", "kana": "ふたりです", "romaji": "futari desu", "say": "foo-tah-ree dess", "audio": "7ae4c6298918", "en": "Two people", "note": "Say the number of people when asked \"nan-mei sama?\". Holding up fingers works too.", "examples": [], "reply": null, "tags": ["say", "polite"], "find": "table for two, two people", "also": []}, {"jp": "予約していないんですけど、大丈夫ですか", "kana": "よやくしていないんですけど、だいじょうぶですか", "romaji": "yoyaku shite inai n desu kedo, daijoubu desu ka", "say": "yoh-yah-koo shee-teh ee-nai n dess keh-doh, dai-joh-boo dess kah", "audio": "d1b6bc40e2a9", "en": "I don't have a reservation, is that OK?", "note": "", "examples": [], "reply": null, "tags": ["say", "polite"], "find": "no reservation, walk in, can we get a table", "also": []}, {"jp": "〜の名前で予約しています", "kana": "〜のなまえでよやくしています", "romaji": "~ no namae de yoyaku shite imasu", "say": "noh nah-mah-eh deh yoh-yah-koo shee-teh ee-mahss", "audio": "41cf619a60c9", "en": "I have a reservation under ___", "note": "", "examples": [{"jp": "スミスの名前で予約しています", "kana": "スミスのなまえでよやくしています", "romaji": "sumisu no namae de yoyaku shite imasu", "say": "soo-mee-soo noh nah-mah-eh deh yoh-yah-koo shee-teh ee-mahss", "audio": "8629ad391f8a", "en": "I have a reservation under Smith."}], "reply": null, "tags": ["say", "polite"], "find": "reservation under name, booked, I have a reservation", "also": []}, {"jp": "どのくらい待ちますか", "kana": "どのくらいまちますか", "romaji": "dono kurai machi const TAGNAME={say:"you say",hear:"you'll hear",both:"say & hear",casual:"casual",polite:"polite",formal:"staff / formal",slang:"slang",rude:"rude",sign:"sign",careful:"careful",kansai:"Kansai",text:"texting",fem:"mostly women",masc:"mostly men"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jpBlock=b=>`<div class="jp" data-a="${b.audio}" lang="ja">${esc(b.jp)}</div><div class="rom"><b>${esc(b.romaji)}</b> · <span class="say">${esc(b.say)}</span></div>`;
function cardHTML(e,where){
  let sub="";
  for(const x of e.also) sub+=`<div class="sub"><div class="label">also</div>${jpBlock(x)}<div>${esc(x.en)}</div></div>`;
  for(const x of e.examples) sub+=`<div class="sub"><div class="label">example</div>${jpBlock(x)}<div>${esc(x.en)}</div></div>`;
  if(e.reply) sub+=`<div class="sub"><div class="label">how to reply</div>${jpBlock(e.reply)}<div>${esc(e.reply.en)}</div></div>`;
  return `<div class="card">${where?`<div class="where">${esc(where)}</div>`:""}${jpBlock(e)}<div class="en">${esc(e.en)}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:""}${sub}<div class="tags">${e.tags.map(t=>`<span class="${t}">${TAGNAME[t]||t}</span>`).join("")}</div></div>`;
}

const STOP=new Set("a an the to i me my you your is are am do does did how what say in of for it this that please can could would want wanna like too japanese japan word phrase".split(" "));

const ENTRIES=[];let html="",nav="",n=0;
for(const c of DATA.categories){
  nav+=`<a href="#c${c.id}">${esc(c.title)}</a>`;
  html+=`<section class="cat" id="c${c.id}"><h2>${esc(c.title)}</h2><p class="blurb">${esc(c.blurb)}</p>`;
  for(const s of c.sections){
    html+=`<div class="sec">${s.title?`<h3>${esc(s.title)}</h3>`:""}`;
    for(const e of s.entries){
      n++; html+=cardHTML(e);
      const f={exRaw:[...e.also,...e.examples].map(x=>" "+words(x.en).join(" ")+" ").join("|"),enRaw:" "+words(e.en).join(" ")+" ",enExact:new Set(words(e.en)),findRaw:" "+words(e.find).join(" ")+" ",en:new Set(words(e.en).map(stem)),find:new Set(words(e.find).map(stem)),
        jp:(e.jp+" "+e.kana+" "+e.romaji.replace(/ /g,"")+" "+e.romaji).toLowerCase(),
        more:new Set(words([e.note,...e.also.map(x=>x.en+" "+x.romaji),...e.examples.map(x=>x.en+" "+x.romaji)].join(" ")).map(stem))};
      // "headwords": each meaning on its own, e.g. "Huh? / What?" -> {"huh","what"}
      // (Map: meaning -> position, so an entry's FIRST meaning counts most)

      f.single=!e.romaji.includes(" ")&&!e.jp.includes("〜");
      f.core=c.id==="01";   // survival essentials win ties

function score(f,terms,raw,phrase,exact){
  let s=0,hit=0;
  // the query IS one of this entry's meanings ("what" -> 何): the word itself wins
  const bare=phrase.replace(/^(to|a|an|the) /,"");
  if(f.heads.has(bare))s+=(f.heads.get(bare)===0?25:20)+(f.single?4:0)+(f.core?6:0);
  s+=1.5/(1+f.len);   // tie-break: shorter, more direct meanings first
  // the whole query appearing as a phrase in the meaning beats scattered words
  if(phrase.includes(" ")&&f.enRaw.includes(" "+phrase+" "))s+=12;
  else if(phrase.includes(" ")&&f.findRaw.includes(" "+phrase))s+=8;
  else if(phrase.includes(" ")&&f.exRaw.includes(" "+phrase+" "))s+=9;
  for(const w of exact)if(f.enExact.has(w))s+=1;
  for(const t of terms){
    let best=0;
    if(f.en.has(t))best=4;
    else if(f.find.has(t))best=3;
    else if(t.length>=3&&f.jp.includes(t))best=3;
    else if(t.length>=4&&[...f.en,...f.find].some(w=>w.startsWith(t)))best=2;
    else if(f.more.has(t))best=1;
    if(best)hit++;s+=best;
  }
  if(raw.length>=2&&f.jp.includes(raw))s+=6;
  return hit?s*(hit/terms.length)**2:0;
}
const qEl=document.getElementById("q"),res=document.getElementById("results"),br=document.getElementById("browse"),navEl=document.getElementById("nav"),cnt=document.getElementById("count"),clr=document.getElementById("clear");
function search(){
  const raw=qEl.value.trim().toLowerCase().normalize("NFKC");
  clr.style.display=raw?"block":"none";
  if(!raw){res.classList.add("hidden");br.classList.remove("hidden");navEl.classList.remove("hidden");cnt.textContent="";return}
  let terms=words(raw).filter(w=>!STOP.has(w)).map(stem);
  if(!terms.length)terms=words(raw).map(stem);
  const phrase=words(raw).join(" "),exact=words(raw).filter(w=>!STOP.has(w));
  let ranked=ENTRIES.map(x=>[score(x.f,terms,raw.replace(/\s+/g,""),phrase,exact),x]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]);
  const seenCard=new Set();
  ranked=ranked.filter(([,x])=>{const k=x.e.jp+"|"+x.e.en;if(seenCard.has(k))return false;seenCard.add(k);return true}).slice(0,40);
  br.classList.add("hidden");navEl.classList.add("hidden");res.classList.remove("hidden");
  res.innerHTML=ranked.length?ranked.map(([,x])=>cardHTML(x.e,x.where)).join(""):`<div class="empty">Nothing found. Try other words, e.g. "bathroom", "check", "spicy".</div>`;
  cnt.textContent=ranked.length?`${ranked.length} best matches`:"";
  window.scrollTo(0,0);
}

// ---------- offline web app ----------
(function(){
  const inst=document.getElementById("install");
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)){
    inst.innerHTML='To install: tap <b>Share</b> <span aria-hidden="true">⎋</span> then <b>Add to Home Screen</b>. It then works with no internet.';
    inst.style.display="block";
  }
  if(!("serviceWorker" in navigator)||location.protocol==="file:")return;
  navigator.serviceWorker.register("sw.js");
  const msg=document.getElementById("offline");
  const ids=new Set();
  const add=b=>b&&ids.add(b.audio);
  for(const c of DATA.categories)for(const s of c.sections)for(const e of s.entries){add(e);e.also.forEach(add);e.examples.forEach(add);add(e.reply)}
  const urls=[...ids].map(a=>AUDIO_BASE+a+AUDIO_EXT);
  (async()=>{
    try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}
    const cache=await caches.open("pj-audio-v1");
    const have=new Set((await cache.keys()).map(r=>new URL(r.url).pathname.split("/").pop()));
    const todo=urls.filter(u=>!have.has(u.split("/").pop()));
    let done=urls.length-todo.length;
    for(let i=0;i<todo.length;i+=16){
      if(!navigator.onLine){msg.textContent=`Offline: ${done}/${urls.length} sounds saved. Reopen with internet to finish.`;return}
      await Promise.all(todo.slice(i,i+16).map(u=>cache.add(u).catch(()=>{})));
      done=Math.min(urls.length,done+16);
      msg.textContent=`Saving sounds for offline use… ${Math.round(done/urls.length*100)}%`;
    }
    const n=(await cache.keys()).length;
    msg.className=n>=urls.length?"ok":"";
    msg.textContent=n>=urls.length?"✓ Everything saved. Works with no internet.":`${n}/${urls.length} sounds saved. Reopen with internet to finish.`;
    if(n>=urls.length)setTimeout(()=>msg.textContent="",4000);
  })();
})();
